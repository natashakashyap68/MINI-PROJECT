{% extends "base.html" %}

{% block title %}Create Account - AI Viva Prep Bot{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-header text-center">
            <h2>Create Your Account</h2>
            <p class="text-muted">Start practicing technical vivas with automated AI scoring.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password (min 6 characters)</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register & Get Started</button>
        </form>

        <div class="card-footer text-center">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign In here</a></p>
        </div>
    </div>
</div>
{% endblock %}
